name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: GOOS=windows GOARCH=amd64 go build ./cmd/netcheck
      - run: GOOS=linux GOARCH=arm64 go build ./cmd/netcheck
      - run: docker build -t netprobe:test .
