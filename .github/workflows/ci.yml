name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web build
      - run: go test -race ./...
      - run: go vet ./...
      - run: GOOS=windows GOARCH=amd64 go build ./cmd/netcheck
      - run: GOOS=linux GOARCH=arm64 go build ./cmd/netcheck
      - run: docker build -t netprobe:test .
